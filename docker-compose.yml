# LAN Jukebox. Fill in the example.com / CHANGE_ME placeholders before `docker compose up -d`,
# and keep your filled-in copy LOCAL — never commit real secrets.
# See README.md for what every setting does, ingress options, and cookie/PO-token setup.

services:
  jukebox:
    image: ghcr.io/atvriders/lan-jukebox:latest
    pull_policy: always
    init: true
    environment:
      # Server
      PORT: "3018"
      HOST: "0.0.0.0"
      NODE_ENV: "production"
      LOG_LEVEL: "info"

      # Public URL
      PUBLIC_BASE_URL: "https://jukebox.example.com"
      ALLOWED_WS_ORIGINS: "https://jukebox.example.com" # must equal PUBLIC_BASE_URL exactly

      # Auth
      VIEWER_PASSWORD: "CHANGE_ME"
      ALLOW_NO_PASSWORD: "false"
      SESSION_SECRET: "CHANGE_ME_AT_LEAST_32_CHARACTERS_LONG" # >= 32 chars

      # Cache
      CACHE_DIR: "/data/cache"
      CACHE_MAX_MB: "5000"

      # Limits
      HISTORY_MAX_ITEMS: "100"
      SEARCH_RESULT_COUNT: "10"
      PREFETCH_DEPTH: "3"
      MAX_TRANSCODE_JOBS: "4"
      MAX_TRACK_DURATION_SEC: "0" # 0 = no cap

      # YouTube
      YT_PROXY: ""
      YT_COOKIES: "" # path to a mounted cookies.txt; wins over YT_COOKIES_TEXT
      YT_COOKIES_TEXT: ""
      YT_PLAYER_CLIENTS: "android_vr,web_embedded,tv"
      PO_TOKEN_PROVIDER_URL: "" # only with --profile pot
    ports: ["${HOST_PORT:-3018}:3018"]
    volumes: ["cache:/data/cache"]
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3018)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Optional PO-token sidecar: docker compose --profile pot up -d
  bgutil-pot:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    profiles: ["pot"]
    init: true
    restart: unless-stopped
    expose: ["4416"]

volumes:
  cache:
